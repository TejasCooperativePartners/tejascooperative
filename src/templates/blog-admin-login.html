<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Tejas Cooperative Partners</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/blog-admin.css">
</head>
<body class="admin-body">

<main class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="/assets/tejas-icon.jpg" alt="" class="admin-login-logo">
    <p class="eyebrow">Tejas Cooperative Partners</p>
    <h1>Blog Admin</h1>
    <p class="admin-login-sub">Enter the admin password to continue.</p>

    <form id="login-form" class="admin-login-form" novalidate>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      </div>
      <p class="admin-login-error" id="login-error" role="alert"></p>
      <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
    </form>
  </div>
</main>

<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const password = document.getElementById('password').value;
      const res = await fetch('/blog/admin/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });

      if (res.ok) {
        window.location.href = '/blog/admin';
        return;
      }

      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Incorrect password';
    } catch (err) {
      errorEl.textContent = 'Something went wrong. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
